<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Notas - Colegio</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>Sistema de Seguimiento de Notas</h1>

    <nav id="pestañas">
        <button class="tab-btn activo" data-tab="tabEstudiantes">Estudiantes y Notas</button>
        <button class="tab-btn" data-tab="tabMaterias">Materias</button>
        <button class="tab-btn" data-tab="tabPromedios">Promedios</button>
    </nav>

    <div id="tabEstudiantes" class="tab-contenido activo">
        <section>
            <h2>Estudiantes</h2>
            <form id="formEstudiante">
                <input type="hidden" id="estudianteId">
                <input type="text" id="nombreEstudiante" placeholder="Nombre" required>
                <input type="text" id="gradoEstudiante" placeholder="Grado (ej: 10-A)" required>
                <button type="submit">Guardar</button>
            </form>

            <table id="tablaEstudiantes">
                <thead>
                    <tr><th>TI</th><th>Nombre</th><th>Grado</th><th>Acciones</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section>
            <h2>Registrar Nota</h2>
            <form id="formNota">
                <input type="number" id="idEstudianteNota" placeholder="ID Estudiante" required>
                <select id="idMateriaNota" required>
                    <option value="">-- Selecciona una materia --</option>
                </select>
                <input type="number" step="0.1" id="valorNota" placeholder="Valor (0.0 - 5.0)" required>
                <input type="number" id="periodoNota" placeholder="Periodo" required>
                <button type="submit">Registrar Nota</button>
            </form>
        </section>
    </div>

    <div id="tabMaterias" class="tab-contenido">
        <section>
            <h2>Materias</h2>
            <form id="formMateria">
                <input type="hidden" id="materiaId">
                <input type="text" id="nombreMateria" placeholder="Nombre de la materia" required>
                <button type="submit">Guardar</button>
            </form>

            <table id="tablaMaterias">
                <thead>
                    <tr><th>ID</th><th>Nombre</th><th>Acciones</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </div>

    <div id="tabPromedios" class="tab-contenido">
        <section>
            <h2>Consultar Promedio</h2>
            <input type="number" id="idEstudianteConsulta" placeholder="ID Estudiante">
            <input type="number" id="idMateriaConsulta" placeholder="ID Materia">
            <button id="btnConsultarPromedio">Ver Promedio</button>
            <p id="resultadoPromedio"></p>
        </section>

        <section>
            <h2>Promedio General por Materia</h2>
            <select id="filtroGradoPromedio">
                <option value="">-- Todos los cursos --</option>
            </select>
            <button id="btnVerPromedioMaterias">Ver Promedios</button>

            <table id="tablaPromedioMaterias">
                <thead>
                    <tr><th>Materia</th><th>Promedio</th><th>Estado</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </div>

    <script src="app.js"></script>
</body>
